<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>自动验证 · 检索 Worker</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=90"></head>
<body class="m-舆图 nopanel">
<div id="map"></div><div class="paper-wash"></div><div class="grain"></div>
<header><div class="brand"><div class="seal">方</div><div><h1>方舆经纬</h1><p>读史方舆纪要</p></div></div>
<nav id="modes"><button data-m="舆图" class="on"><b>舆　图</b></button></nav>
<div id="searchwrap"><input id="search"><div id="sresults"></div></div></header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button><div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">纪要</div></div><div id="pbody"></div></section>
<footer><span id="modelabel">舆图</span><span id="modenote"></span><span class="fb" id="bookstat"></span></footer>
<div id="tl"></div><div id="tlPlay"></div><div id="boot"></div>
<pre id="testlog" style="position:fixed;z-index:999;background:#fff;font:12px/1.6 monospace">PENDING</pre>
<script>window.onerror=function(m){document.title="R3D-ERR:"+m;return false;};</script>
<script src="data/site_data.js" defer></script>
<script src="js/config.js?v=90" defer></script>
<script src="js/map.js?v=90" defer></script>
<script src="js/panels.js?v=90" defer></script>
<script src="js/rail.js?v=90" defer></script>
<script src="js/search.js?v=90" defer></script>
<script src="js/reader.js?v=90" defer></script>
<script src="js/bookmarks.js?v=90" defer></script>
<script src="js/fulltext.js?v=90" defer></script>
<script src="js/app.js?v=90" defer></script>
<script src="js/modes.js?v=90" defer></script>
<script src="js/analytics.js?v=90" defer></script>
<script src="js/wenxin.js?v=90" defer></script>
<script src="js/bian.js?v=90" defer></script>
<script defer>
var NL=String.fromCharCode(10),log=[];
function P(n,ok){log.push(n+" "+(ok?"PASS":"FAIL"));document.title="R3DP:"+log.join(";");}
function done(){document.getElementById("testlog").textContent="TESTLOG"+NL+log.join("; ")+NL+"ENDLOG";
  document.title="R3D:"+log.join(";");}
window.addEventListener("load",function(){
  setTimeout(function(){
    try{
      P("FT-RUN",typeof ftRun==="function");
      ftRun("形胜");
      var n=0;
      var iv=setInterval(function(){
        n++;
        var h=document.getElementById("sresults").innerHTML;
        if(h.indexOf("fthead")>=0||h.indexOf("none")>=0||n>50){
          clearInterval(iv);
          try{window.__ftw&&window.__ftw.terminate();}catch(_){}
          P("RESULTS",h.indexOf("fthead")>=0);
          P("WORKER-PATH",window.__ftwUsed===true);
          done();
        }
      },400);
    }catch(e){P("ERR "+e,false);done();}
  },1500);
});
</script></body></html>
