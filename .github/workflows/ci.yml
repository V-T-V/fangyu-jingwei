name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖与浏览器
        run: |
          python -m pip install --quiet requests beautifulsoup4
          # 2026-11-17 教训：ubuntu 镜像迁移期 chromium-browser 是 snap 过渡壳，
          # 容器内不可用且 || true 吞错——改用 runner 预装 Chrome，缺件即响
          test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - name: 数据完整性 verify.py
        run: python verify.py
      - name: 起本地服务
        run: |
          python -m http.server 9200 --bind 127.0.0.1 &
          sleep 2
          curl -sf http://127.0.0.1:9200/index.html -o /dev/null && echo server-up
      - name: 无头回归 run_tests.py
        env:
          FY_BROWSER: /usr/bin/google-chrome
          FY_BASE: http://127.0.0.1:9200/
        run: python run_tests.py
