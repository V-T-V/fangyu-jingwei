# 周六深度审计（八兵器确定性子集）——README「周六 09:30 深度审计」的仓库内承载。
# 此前该审计仅存在于本机计划任务；现落进 Actions：周六 01:30 UTC（= 中国 09:30）自动跑，
# 亦可 workflow_dispatch 手动触发。每步失败即红，不设任何吞错兜底（lint L13 / 教训 20）。
#
# 证据口径：boot_smoke 会把截图写 docs/evidence/，但 runner 是临时盘、跑完即焚、不回传仓库
# ——落账以 Actions 日志（各探针逐项 JSON 报告）为准。
#
# 八兵器中不含两件，理由：
#   audit_features —— 每日 09:00 本机计划任务已在跑（decisions.tsv 本机落账），仓库内重复承载无增量；
#   perf_probe     —— 测量型工具，无 ok 判据（不红不绿）；且性能数字受 runner 负载（「天气」）影响大，
#                     定时跑只产出抖动数字与偶发误红，不具仲裁力。性能主张仍以本机 perf 探针 A/B 为准。
name: 深度审计
on:
  schedule:
    - cron: "30 1 * * 6"   # 周六 01:30 UTC = 中国 09:30（README 现行宣称口径）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FY_BROWSER: /usr/bin/google-chrome
      FY_CDP_PORT: "9345"
      FY_BASE: http://127.0.0.1:9200/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 浏览器存在性检验
        run: |
          # 与 ci.yml 同款：runner 预装 Chrome（2026-11-17 教训：镜像迁移期 chromium 是
          # snap 过渡壳不可用），缺件即红，绝不兜底
          test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - name: 装依赖（CDP 通道）
        run: python -m pip install --quiet websocket-client
      - name: 起本地服务
        run: |
          python -m http.server 9200 --bind 127.0.0.1 &
          sleep 2
          curl -sf http://127.0.0.1:9200/index.html -o /dev/null && echo server-up
      - name: boot_smoke 2D（真页心电图，十步全入口）
        timeout-minutes: 5
        run: python tools/boot_smoke.py
      - name: boot_smoke 3D（五步驱动）
        timeout-minutes: 5
        # boot_smoke 把 argv 原样交给 CDP Page.navigate：裸 "3d.html" 是相对 URL，
        # 导航失败即停在 about:blank，空守卫步骤零错误假绿（v119 实录：两份证据 PNG
        # 字节级全白）。必须传绝对 URL——URL 含 "3d.html" 子串，五步剧本与
        # smoke-3d 证据命名仍按它判别。
        run: python tools/boot_smoke.py "${FY_BASE}3d.html"
      - name: offline_check（断网三验 + 全文检索 --texts）
        timeout-minutes: 10
        run: python tools/offline_check.py --texts
      - name: bandwidth_probe（首访 vs 再访传输字节）
        timeout-minutes: 5
        run: python tools/bandwidth_probe.py
      - name: heap_probe（180 轮 UI 循环内存行为）
        timeout-minutes: 15
        run: python tools/heap_probe.py
      - name: chaos_monkey（默认 200 拳，种子 42 可复现）
        timeout-minutes: 10
        run: python tools/chaos_monkey.py
      - name: 收尾清理
        if: always()   # 前步已红时也收无头残留（pkill）；此步只收尾，不改任何结论
        run: python tools/control_fy.py cleanup
