<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../">
<meta charset="UTF-8">
<title>自动验证 · 县治</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=43">
</head>
<body class="m-舆图 nopanel">
<div id="map"></div>
<div class="paper-wash"></div><div class="grain"></div>
<header><div class="brand"><div class="seal">方舆</div><div><h1>方舆经纬</h1><p>读史方舆纪要 · 顾祖禹 · 全书舆图</p></div></div>
<nav id="modes">
  <button data-m="舆图" class="on"><b>舆　图</b></button>
  <button data-m="形势"><b>形　势</b></button>
  <button data-m="川渎"><b>川　渎</b></button>
</nav>
<div id="searchwrap"><input id="search"><div id="sresults"></div></div></header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button>
  <div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">纪要</div></div>
  <div id="pbody"></div></section>
<footer><span id="modelabel">舆图</span><span id="modenote"></span><span class="fb" id="bookstat"></span></footer>
<div id="tl"></div>
<pre id="testlog" style="position:fixed;left:8px;top:8px;z-index:999;background:#fff;border:2px solid #b23a2e;padding:8px;font:12px/1.6 monospace;max-width:460px;white-space:pre-wrap"></pre>

<script src="data/site_data.js" defer></script>
<script src="js/config.js?v=43" defer></script>
<script src="js/map.js?v=43" defer></script>
<script src="js/panels.js?v=43" defer></script>
<script src="js/rail.js?v=43" defer></script>
<script src="js/search.js?v=43" defer></script>
<script src="js/reader.js?v=43" defer></script>
<script src="js/bookmarks.js?v=43" defer></script>
<script src="js/fulltext.js?v=43" defer></script>
<script src="js/app.js?v=43" defer></script>
<script src="js/modes.js?v=43" defer></script>
<script defer>
window.addEventListener("error",function(e){document.title="ERR:"+e.message});
window.addEventListener("load",function(){
  var NL=String.fromCharCode(10),log=[];
  var done=function(){
    document.getElementById("testlog").textContent="TESTLOG"+NL+log.join("; ")+NL+"ENDLOG";
    document.title=log.every(function(l){return l.indexOf("PASS")>=0})?"ALL-PASS":"HAS-FAIL";
  };
  setTimeout(function(){
    try{
      /* 门控后县点 z≥7 才挂载：先升到府级缩放再计数 */
      /* animate:false 时 zoomend 在 setZoom 内同步触发，直接等一拍取 DOM */
      map.setZoom(8,{animate:false});
      setTimeout(function(){
        try{
          var dots=document.querySelectorAll(".xseal").length;
          log.push("COUNTY="+dots+(dots>=800?" PASS":" FAIL"));
          var bz=FY.provinces.find(function(p){return p.id==="beizhi"});
          var st=bz.fu.find(function(u){return u.n==="顺天府"});
          var lx=st.xianc&&st.xianc["良乡县"];
          var pos=Array.isArray(lx)?lx:(lx?lx.c:null);
          log.push("LIANGXIANG="+(pos?pos.join(","):"none")+(pos&&Math.abs(pos[0]-39.74)<0.1?" PASS":" FAIL"));
          var ok=typeof revealCounty==="function"?revealCounty("beizhi","顺天府","良乡县"):false;
          log.push("REVEAL="+ok+(ok?" PASS":" FAIL"));
          done();
        }catch(e){log.push("ERR "+e);done();}
      },800);
    }catch(e){log.push("ERR "+e);done();}
  },3000);
});
</script>
</body>
</html>
