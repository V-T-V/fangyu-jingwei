<!DOCTYPE html><html lang="zh-CN"><head>
<base href="../"><meta charset="UTF-8"><title>自动验证 · 底图切换</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=93"></head>
<body class="m-舆图 nopanel">
<div id="map"></div>
<button id="bmtoggle">影像</button><div class="paper-wash"></div><div class="grain"></div>
<header><div class="brand"><div class="seal">方</div><div><h1>方舆经纬</h1><p>读史方舆纪要</p></div></div>
<nav id="modes"><button data-m="舆图" class="on"><b>舆　图</b></button></nav>
<div id="searchwrap"><input id="search"><div id="sresults"></div></div></header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button><div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">纪要</div></div><div id="pbody"></div></section>
<footer><span id="modelabel">舆图</span><span id="modenote"></span><span class="fb" id="bookstat"></span></footer>
<div id="tl"></div><div id="tlPlay"></div><div id="boot"></div>
<pre id="testlog" style="position:fixed;left:8px;top:8px;z-index:999;background:#fff;border:2px solid #b23a2e;padding:8px;font:12px/1.6 monospace;max-width:480px;white-space:pre-wrap"></pre>
<script src="data/site_data.js" defer></script>
<script src="js/config.js?v=93" defer></script><script src="js/map.js?v=93" defer></script><script src="js/panels.js?v=93" defer></script><script src="js/rail.js?v=93" defer></script><script src="js/search.js?v=93" defer></script><script src="js/reader.js?v=93" defer></script><script src="js/bookmarks.js?v=93" defer></script><script src="js/fulltext.js?v=93" defer></script><script src="js/app.js?v=93" defer></script><script src="js/modes.js?v=93" defer></script><script src="js/analytics.js?v=93" defer></script><script src="js/wenxin.js?v=93" defer></script><script src="js/bian.js?v=93" defer></script>
<script defer>
var NL=String.fromCharCode(10),log=[];
function P(n,ok){log.push(n+" "+(ok?"PASS":"FAIL"));}
function done(){document.getElementById("testlog").textContent="TESTLOG"+NL+log.join("; ")+NL+"ENDLOG";}
window.addEventListener("load",function(){
  setTimeout(function(){
    try{
      var btn=document.getElementById("bmtoggle");
      P("BTN",!!btn&&/^(影像|地形)$/.test(btn.textContent));
      P("INIT-PHYS",!document.body.classList.contains("imgbasemap"));
      btn.click();
      P("IMG-ON",document.body.classList.contains("imgbasemap")&&btn.textContent==="地形");
      P("PERSIST",localStorage.getItem("fybasemap")==="imagery");
      var t=document.querySelector(".leaflet-tile");
      P("TILE-SWAP",!!t&&/World_Imagery/.test(t.src));
      btn.click();
      P("BACK-PHYS",!document.body.classList.contains("imgbasemap")&&localStorage.getItem("fybasemap")==="physical");
      done();
    }catch(e){log.push("ERR "+e);done();}
  },2500);
});
</script></body></html>
