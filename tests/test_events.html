<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../">
<meta charset="UTF-8">
<title>自动验证 · 事件定位</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script>window.__NOTILES__=1;/* 测试密封：不拉外网瓦片 */</script>
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=116">
</head>
<body class="m-舆图 nopanel">
<div id="map"></div>
<div class="paper-wash"></div><div class="grain"></div>
<header><div class="brand"><div class="seal">方舆</div><div><h1>方舆经纬</h1><p>自动验证页</p></div></div>
<nav id="modes">
  <button data-m="舆图" class="on"><b>舆　图</b></button>
  <button data-m="形势"><b>形　势</b></button>
  <button data-m="川渎"><b>川　渎</b></button>
</nav>
<div id="searchwrap"><input id="search"><div id="sresults"></div></div></header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button>
  <div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">纪要</div></div>
  <div id="pbody"></div></section>
<footer><span id="modelabel">舆图</span><span id="modenote"></span><span class="fb" id="bookstat"></span></footer>
<div id="tl"></div>
<pre id="testlog" style="position:fixed;left:8px;top:8px;z-index:999;background:#fff;border:2px solid #b23a2e;padding:8px;font:12px/1.6 monospace;max-width:460px;white-space:pre-wrap"></pre>

<script src="data/site_data.js" defer></script>
<script src="js/config.js?v=116" defer></script>
<script src="js/map.js?v=116" defer></script>
<script src="js/panels.js?v=116" defer></script>
<script src="js/rail.js?v=116" defer></script>
<script src="js/search.js?v=116" defer></script>
<script src="js/reader.js?v=116" defer></script>
<script src="js/bookmarks.js?v=116" defer></script>
<script src="js/fulltext.js?v=116" defer></script>
<script src="js/app.js?v=116" defer></script>
<script src="js/modes.js?v=116" defer></script>
<script defer>
window.addEventListener("error", (e) => {
  const el = document.getElementById("testlog");
  if (el && !el.textContent.startsWith("TESTLOG"))
    el.textContent = "PAGE-ERR " + (e.message || e.error);
});
window.addEventListener("load", () => {
  const NL = String.fromCharCode(10);
  const log = [];
  const done = () => {
    document.getElementById("testlog").textContent = "TESTLOG" + NL + log.join("; ") + " ENDLOG";
    document.title = log.every(l => l.includes("PASS")) ? "ALL-PASS" : "HAS-FAIL";
  };
  document.getElementById("testlog").textContent = "LOADED";
  setTimeout(() => {
    try {
      // 深链两汉（era=1），点"赤壁鏖兵"事件 → 应飞往 ~29.7,113.6
      buildEra(1); openEra(1); highlightRail("形势", 1);
      document.body.className = "m-形势 nopanel";
      const evs = Array.from(document.querySelectorAll(".evg"));
      const chibi = evs.find(e => e.innerText.includes("赤壁"));
      const origFly = map.flyTo.bind(map);
      let flyTarget = null;
      map.flyTo = function(c, z, o){ flyTarget = c; return origFly(c, z, o); };
      chibi.click();
      setTimeout(() => {
        const ft = flyTarget ? [flyTarget.lat !== undefined ? flyTarget.lat : flyTarget[0],
                                flyTarget.lng !== undefined ? flyTarget.lng : flyTarget[1]] : null;
        const near = ft && Math.abs(ft[0] - 29.72) < 0.01 && Math.abs(ft[1] - 113.62) < 0.01;
        log.push("EVENT-FLY chibi target=" + (ft ? ft[0].toFixed(2) + "," + ft[1].toFixed(2) : "none") + (near ? " PASS" : " FAIL"));
        const located = ERAS.reduce((s, e) => s + e.evs.filter(v => v[2]).length, 0);
        log.push("EVENT-COUNT located=" + located + (located >= 25 ? " PASS" : " FAIL"));
        // 量距：容器两 shift+click → 公里/明里标签（Leaflet 听容器非 canvas——2026-11-18 实测）
        setMode("舆图");
        const mc = document.getElementById("map");
        const mb = mc.getBoundingClientRect();
        const fireM = (fx, fy) => mc.dispatchEvent(new MouseEvent("click",
          {clientX: mb.left + mb.width*fx, clientY: mb.top + mb.height*fy, shiftKey: true, bubbles: true}));
        fireM(0.3, 0.4); fireM(0.7, 0.6);
        setTimeout(() => {
          let mlab = "";
          for (const e of document.querySelectorAll(".leaflet-marker-icon")) {
            const t = e.textContent || "";
            if (t.indexOf("公里") >= 0) { mlab = t; break; }
          }
          const mok = mlab.indexOf("公里") >= 0 && mlab.indexOf("明里") >= 0;
          log.push("MEASURE " + (mok ? "PASS" : "FAIL label=" + (mlab.trim().slice(0, 24) || "none")));
          // 键盘矩阵：/ 聚焦 · ←→ 切卷（rail 高亮）· 输入中不抢键
          setTimeout(() => {
            try {
              setMode("形势");   // 箭头键只在形势模式工作（量距块已切回舆图）
              const dk = k => document.dispatchEvent(new KeyboardEvent("keydown", {key: k, bubbles: true}));
              dk("/");
              const kSlash = document.activeElement === document.getElementById("search");
              document.activeElement.blur();
              const eraOn = () => { const e = document.querySelector("#raillist .ri.on"); return e ? e.dataset.e : null; };
              dk("ArrowRight");
              setTimeout(() => {
                const e1 = eraOn();
                dk("ArrowLeft");
                setTimeout(() => {
                  const e2 = eraOn();
                  const kArrow = e1 !== null && String(e1) !== String(e2);
                  document.getElementById("search").focus();
                  document.getElementById("search").dispatchEvent(new KeyboardEvent("keydown", {key: "ArrowRight", bubbles: true}));
                  const kGuard = eraOn() === e2;   // 输入中不切卷
                  document.activeElement.blur();
                  log.push(`KEYBOARD slash=${kSlash} arrow=${kArrow} guard=${kGuard} ` +
                           ((kSlash && kArrow && kGuard) ? "PASS" : "FAIL"));
                  done();
                }, 700);
              }, 700);
            } catch (e) { log.push("ERR-KB " + e); done(); }
          }, 300);
        }, 900);
      }, 2600);
    } catch (e) { log.push("ERR " + e); done(); }
  }, 2500);
});
</script>
</body>
</html>
