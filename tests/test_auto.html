<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../">
<meta charset="UTF-8">
<title>自动验证 · 方舆经纬</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script>window.__NOTILES__=1;/* 测试密封：不拉外网瓦片 */</script>
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=121">
</head>
<body class="m-舆图 nopanel">
<div id="map"></div>
<div class="paper-wash"></div><div class="grain"></div>
<header><div class="brand"><div class="seal">方舆</div><div><h1>方舆经纬</h1><p>自动验证页</p></div></div>
<nav id="modes">
  <button data-m="舆图" class="on"><b>舆　图</b></button>
  <button data-m="形势"><b>形　势</b></button>
  <button data-m="川渎"><b>川　渎</b></button>
</nav>
<div id="searchwrap"><input id="search"><div id="sresults"></div></div></header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button>
  <div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">纪要</div></div>
  <div id="pbody"></div></section>
<footer><span id="modelabel">舆图</span><span id="modenote"></span><span class="fb" id="bookstat"></span></footer>
<button id="bmtoggle" title="影像切换">影像</button>
<span class="ftools-label">探索</span>
  <button class="ftool" id="wanderlink" title="随机游历帝国一隅">⚑ 漫步</button>
  <button class="ftool" id="analyticslink" title="全书空间统计——距离·面积·分布">📊 透视</button>
  <button class="ftool" id="wenxinlink" title="文本计量——书架·战略词·被引">🖋 文心</button>
  <button class="ftool" id="bianlink" title="九边防线专题">⚔ 九边</button>
  <button class="ftool" id="tdlink" title="三维形胜——真地形上观天下">⛰ 形胜</button>
  <span class="sep"></span><span id="modelabel">舆图</span><span class="sep"></span>
  <span id="modenote">十五布政使司 · 府州县治所见于图</span>
  <span class="sep"></span><span class="fb" id="bookstat"></span>
  <div class="right"><span id="swstate" title="Service Worker 就绪后：整本书与已览瓦片离线可用" style="display:none;color:var(--azur-d);cursor:default"></span><span id="tablelink" style="cursor:pointer">古今对照</span><span id="aboutlink" style="cursor:pointer">关于 · 校勘记</span><span>文本 · 国学导航</span><span>底图 · Esri World Physical</span></div>
</footer>
<div id="tl"></div>
<pre id="testlog" style="position:fixed;left:8px;top:8px;z-index:999;background:#fff;border:2px solid #b23a2e;padding:8px;font:12px/1.6 monospace;max-width:420px;white-space:pre-wrap"></pre>

<script src="data/site_data.js" defer></script>
<script src="js/config.js?v=121" defer></script>
<script src="js/map.js?v=121" defer></script>
<script src="js/panels.js?v=121" defer></script>
<script src="js/rail.js?v=121" defer></script>
<script src="js/search.js?v=121" defer></script>
<script src="js/reader.js?v=121" defer></script>
<script src="js/bookmarks.js?v=121" defer></script>
<script src="js/ft_core.js?v=121" defer></script>
<script src="js/fulltext.js?v=121" defer></script>
<script src="js/app.js?v=121" defer></script>
<script src="js/modes.js?v=121" defer></script>
<script defer>
window.addEventListener("load", () => {
  const log = [];
  const P = (n, ok) => log.push(n + " " + (ok ? "PASS" : "FAIL"));
  const done = () => {
    document.getElementById("testlog").textContent =
      "TESTLOG\n" + log.join("\n") + "\nENDLOG";
    document.title = log.some(l => l.includes("FAIL")) ? "HAS-FAIL" : "ALL-PASS";
  };
  setTimeout(() => {
    try {
      // ① 表内筛选（县页签，过滤"桃源"）
      openTable("xian");
      const f = document.getElementById("tfilter");
      f.value = "桃源";
      f.dispatchEvent(new Event("input"));
      const vis = Array.from(document.querySelectorAll(".fytable tbody tr"))
        .filter(r => r.style.display !== "none");
      const cnt = document.getElementById("tfcount").innerText;
      log.push(`FILTER rows=${vis.length} count="${cnt}" ${vis.length >= 2 && vis.length <= 6 && cnt.includes("/") ? "PASS" : "FAIL"}`);
      log.push(`FILTER-SAMPLE ${vis.slice(0, 3).map(r => r.innerText.split("\n")[0]).join(",")}`);
      // ② 漕河 24 点 + Chaikin 平滑生效（曲线点数 > 控制点数）
      setMode("川渎");
      setTimeout(() => {
        try {
          const r = RIVERS.find(x => x.key === "漕河");
          const smooth = chaikin(r.pts.map(p => [p[0], p[1]]), 2);
          const paths = Array.from(document.querySelectorAll("#map path"));
          const canal = document.querySelector(".rvlab");
          log.push(`CANAL pts=${r.pts.length} smoothed=${smooth.length} ${r.pts.length === 24 && smooth.length > 90 ? "PASS" : "FAIL"}`);
          const rc = RIVERS.find(x=>x.key==="漕河");
          buildRivers("漕河"); openRiver(rc);
          log.push(`RIVER-PANEL vname=${document.getElementById("vname").textContent} ${document.getElementById("vname").textContent === "漕河" ? "PASS" : "FAIL"}`);
          // ③ 终态切回对照表过滤视图（供截图）
          const anaBtn = document.getElementById("analyticslink");
          anaBtn.click();
          const anaOpen = document.getElementById("panel").classList.contains("open");
          document.getElementById("pclose").click();
          log.push(`FOOTER-BTNS ana=${anaOpen} bian=${typeof document.getElementById("bianlink").onclick === "function"} td=${typeof document.getElementById("tdlink").onclick === "function"} bm=${typeof document.getElementById("bmtoggle").onclick === "function"} ${anaOpen ? "PASS" : "FAIL"}`);
          openTable("xian");
          const f2 = document.getElementById("tfilter");
          f2.value = "桃源";
          f2.dispatchEvent(new Event("input"));
          log.push("FINAL-VIEW table-filter");
          done();
        } catch (e) { P("CANAL-ERR " + e, false); done(); }
      }, 2500);
    } catch (e) { P("FILTER-ERR " + e, false); done(); }
  }, 2500);
});
</script>
</body>
</html>
